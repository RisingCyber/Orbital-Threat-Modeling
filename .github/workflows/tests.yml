name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest -q

      - name: Verify the app boots and loads real SPARTA reference data
        run: |
          python -c "
          from app import create_app
          from app.models import Tactic, Technique, Mitigation
          app = create_app('config.DevConfig')
          with app.app_context():
              assert Tactic.query.count() == 9
              assert Technique.query.count() > 200
              assert Mitigation.query.count() > 100
          print('Reference data loaded correctly.')
          "
